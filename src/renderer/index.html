<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Jewbot</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f1115; color: #e8eaed; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; border-bottom: 1px solid #2a2f3a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
    .badge { font-size: 11px; background: #1f6feb33; color: #79b8ff; padding: 2px 8px; border-radius: 999px; }
    .muted { color: #8b949e; font-size: 12px; }
    .root { font-size: 12px; color: #c9d1d9; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr); gap: 12px; padding: 12px; flex: 1; min-height: 0; }
    .panel { background: #161a22; border: 1px solid #2a2f3a; border-radius: 8px; padding: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    textarea, input { width: 100%; background: #0f1115; color: #e8eaed; border: 1px solid #2a2f3a; border-radius: 6px; padding: 8px; font: inherit; }
    button { background: #238636; color: white; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
    button.secondary { background: #30363d; }
    button.mode.active { outline: 1px solid #79b8ff; }
    button:disabled { opacity: 0.55; cursor: default; }
    pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
    #transcript { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .msg { border-radius: 8px; padding: 8px 10px; max-width: 100%; }
    .msg.user { background: #1c2b22; align-self: flex-end; }
    .msg.assistant { background: #1c212b; align-self: stretch; }
    .msg.error { background: #3d1f24; color: #ffb4b4; }
    .msg .who { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .msg-body { white-space: pre-wrap; font-size: 13px; line-height: 1.45; }
    .tool { border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px; background: #12161d; }
    .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #79b8ff; margin-bottom: 4px; }
    .tool pre { color: #d0d7de; max-height: 220px; overflow: auto; }
    .composer { display: flex; gap: 8px; margin-top: 8px; align-items: flex-end; }
    .composer textarea { flex: 1; resize: vertical; min-height: 52px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    #status { overflow: auto; flex: 1; }
    .ok { color: #3fb950; }
    .bad { color: #f85149; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; overflow: auto; }
      .panel { min-height: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>JEWBOT</h1>
    <span class="badge" id="milestone">M1</span>
    <span class="muted" id="spend">$0 · Ollama</span>
    <span class="root" id="projectRoot" title="">…</span>
    <button class="secondary" id="openProject" type="button">Open project</button>
  </header>
  <main>
    <div class="panel">
      <div class="row">
        <h3 style="margin:0">Chat</h3>
        <button class="secondary mode active" id="modeAgent" type="button">Agent</button>
        <button class="secondary mode" id="modeChat" type="button">Chat</button>
        <span class="muted" id="phase"></span>
      </div>
      <p class="muted" id="hint">Agent streams tokens, then calls list_dir and read_file inside the open project.</p>
      <div id="transcript"></div>
      <div class="composer">
        <textarea id="goal" rows="2" placeholder="Ask Jewbot…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send" type="button">Send</button>
        <button class="secondary" id="stop" type="button" disabled>Stop</button>
      </div>
    </div>
    <div class="panel">
      <div class="row">
        <h3 style="margin:0">Ollama</h3>
        <button class="secondary" id="refresh" type="button">Refresh</button>
      </div>
      <pre id="status">Loading…</pre>
    </div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
