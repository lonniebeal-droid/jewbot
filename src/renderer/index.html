<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Jewbot</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0f1115; color: #e8eaed; }
    header { padding: 12px 16px; border-bottom: 1px solid #2a2f3a; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
    .badge { font-size: 11px; background: #1f6feb33; color: #79b8ff; padding: 2px 8px; border-radius: 999px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: calc(100vh - 56px); box-sizing: border-box; }
    panel, .panel { background: #161a22; border: 1px solid #2a2f3a; border-radius: 8px; padding: 12px; overflow: auto; }
    textarea, input { width: 100%; background: #0f1115; color: #e8eaed; border: 1px solid #2a2f3a; border-radius: 6px; padding: 8px; box-sizing: border-box; }
    button { background: #238636; color: white; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button.secondary { background: #30363d; }
    pre { white-space: pre-wrap; font-size: 12px; }
    .muted { color: #8b949e; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>JEWBOT</h1>
    <span class="badge" id="milestone">M0</span>
    <span class="muted" id="spend">$0 default · Ollama local</span>
  </header>
  <main>
    <div class="panel">
      <h3>Agent</h3>
      <p class="muted">Plan → act → observe. Uses local Ollama when available.</p>
      <textarea id="goal" rows="4" placeholder="Goal for the agent…"></textarea>
      <p style="margin-top:8px">
        <button id="run">Run agent</button>
        <button class="secondary" id="refresh">Refresh status</button>
      </p>
      <pre id="out">Loading…</pre>
    </div>
    <div class="panel">
      <h3>Status</h3>
      <pre id="status"></pre>
    </div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
